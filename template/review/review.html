<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Review</title>
<style>
  :root { --bg:#101318; --panel:#181c23; --ink:#e8ebf0; --muted:#8b93a1; --line:#2a303a; --accent:#3ee0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:24px; padding:24px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px){ main { grid-template-columns:1fr; } }
  video { width:100%; aspect-ratio:9/16; background:#000; border-radius:12px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  button, label.btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#03141a; border-color:var(--accent); font-weight:600; }
  input[type=file] { display:none; }
  .time { font-family:ui-monospace, Menlo, monospace; color:var(--muted); }
  h1 { font-size:18px; margin:0 0 6px; }
  .hint { color:var(--muted); font-size:13px; }
  #noteBox { display:flex; gap:8px; margin:14px 0; }
  #noteBox input { flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  li { display:grid; grid-template-columns:72px 1fr auto; gap:10px; align-items:start; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  li .t { font-family:ui-monospace, Menlo, monospace; color:var(--accent); cursor:pointer; }
  li button { padding:2px 8px; font-size:12px; }
  #empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <section>
    <video id="v" controls playsinline></video>
    <div class="bar">
      <label class="btn" for="file">Load video…</label><input id="file" type="file" accept="video/*">
      <span class="time" id="t">0:00.0</span>
      <span class="hint" id="name">No video loaded</span>
    </div>
    <p class="hint">Space play/pause · ← → 1 s · Shift+← → 5 s · <b>N</b> note at this moment · , . step one frame</p>
  </section>
  <section>
    <h1>Notes for Claude</h1>
    <p class="hint">Watch, press N wherever something is off, type what you want. Then copy all notes and paste them into Claude Code.</p>
    <form id="noteBox" autocomplete="off"><input id="note" placeholder="Press N to note the current moment…"><button class="primary" type="submit">Add</button></form>
    <div class="bar" style="margin-bottom:12px"><button id="copy" type="button">Copy all notes</button><button id="clear" type="button">Clear</button><span class="hint" id="copied"></span></div>
    <ol id="list"></ol>
    <p id="empty">No notes yet.</p>
  </section>
</main>
<script>
const v = document.getElementById("v"), list = document.getElementById("list"), note = document.getElementById("note");
let key = "reel-review", notes = [], at = 0;
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const load = () => { try { notes = JSON.parse(localStorage.getItem(key) || "[]"); } catch { notes = []; } draw(); };
const save = () => { try { localStorage.setItem(key, JSON.stringify(notes)); } catch {} };
function draw() {
  notes.sort((a, b) => a.t - b.t);
  list.innerHTML = notes.map((n, i) => `<li><span class="t" data-i="${i}">${fmt(n.t)}</span><span>${n.text.replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;")}</span><button data-del="${i}" type="button">✕</button></li>`).join("");
  document.getElementById("empty").hidden = notes.length > 0;
}
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  v.src = URL.createObjectURL(f); key = "reel-review:" + f.name; document.getElementById("name").textContent = f.name; load();
});
v.addEventListener("timeupdate", () => document.getElementById("t").textContent = fmt(v.currentTime));
document.addEventListener("keydown", e => {
  if (e.target === note) { if (e.key === "Escape") { note.blur(); v.play(); } return; }
  if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === "ArrowRight") v.currentTime += e.shiftKey ? 5 : 1;
  else if (e.key === "ArrowLeft") v.currentTime -= e.shiftKey ? 5 : 1;
  else if (e.key === ".") { v.pause(); v.currentTime += 1 / 30; }
  else if (e.key === ",") { v.pause(); v.currentTime -= 1 / 30; }
  else if (e.key.toLowerCase() === "n") { e.preventDefault(); v.pause(); at = v.currentTime; note.placeholder = `Note at ${fmt(at)}…`; note.focus(); }
});
note.addEventListener("focus", () => { if (!note.value) at = v.currentTime; });
document.getElementById("noteBox").addEventListener("submit", e => {
  e.preventDefault(); const text = note.value.trim(); if (!text) return;
  notes.push({ t: at, text }); note.value = ""; note.blur(); save(); draw();
});
list.addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.del !== undefined) { notes.splice(+d.del, 1); save(); draw(); }
  else if (d.i !== undefined) { v.currentTime = notes[+d.i].t; v.pause(); }
});
document.getElementById("copy").addEventListener("click", async () => {
  const txt = `Review notes for ${document.getElementById("name").textContent}:\n` + notes.map(n => `${fmt(n.t)} — ${n.text}`).join("\n");
  try { await navigator.clipboard.writeText(txt); document.getElementById("copied").textContent = "Copied"; }
  catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); document.getElementById("copied").textContent = "Copied"; }
});
document.getElementById("clear").addEventListener("click", () => { notes = []; save(); draw(); });
load();
</script>
</body>
</html>
