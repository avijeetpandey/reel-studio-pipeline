<!--
COMPONENT: hand-annotate — a hand-drawn white circle + arrow + handwritten label that DRAWS ITSELF onto the real footage,
pointing at a real object in frame (the key light, the laptop, a line on screen). From the reference reels (iamsarahsnow, 25K:
"keylight" circled with arrows while she says it; WINNING_PATTERNS.md §18). Reads as made by a person, not a template.
Seek-safe with NO callbacks: strokes are drawn by tweening stroke-dashoffset; the label is revealed with a clip-path wipe.

USE: paste CSS + markup into a `.g.clip` layer, set the target box in px (1080×1920 frame), then
  buildAnnotate(tl, { el: "#an1", x: 620, y: 380, w: 260, h: 200, label: "key light", side: "left", start: 14.6, end: 17.8 })
  x/y/w/h = the ellipse around the object (from geometry.json or a frame grab); side = where the label sits ("left" | "right" | "top").
OPTIONS: color (default #fff), arrow (true), circle (true), wobble (0–1, default 0.5: how hand-drawn the ellipse is).
RULES: max 3 per reel; never over the face box; time the draw to the spoken word (start = word start − 0.1 s);
  label 2–3 words, ≥ 48 px; one colour per reel (white on footage, ink on paper treatments).
FEEL: "a marker on glass": circle draws in 0.45 s (power1.inOut), the arrow follows in 0.25 s, the label wipes left→right in 0.3 s;
  exit is a quick 0.2 s fade, never undrawn.
FONT: needs a handwriting font — load "Caveat" (Google Fonts, OFL) in the composition; falls back to cursive.
-->

<!-- CSS -->
<style>
  .an { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; opacity: 0; }
  .an svg { position: absolute; inset: 0; overflow: visible; }
  .an path { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .an .lbl { position: absolute; font: 600 56px/1 Caveat, "Patrick Hand", cursive; white-space: nowrap;
             text-shadow: 0 2px 10px rgba(0,0,0,0.35); clip-path: inset(0 100% 0 0); }
</style>

<!-- MARKUP -->
<div id="an1" class="an"><svg viewBox="0 0 1080 1920"><path class="c"/><path class="a"/></svg><div class="lbl"></div></div>

<!-- JS -->
<script>
  function buildAnnotate(tl, o) {
    const root = document.querySelector(o.el), c = root.querySelector(".c"), a = root.querySelector(".a"), lbl = root.querySelector(".lbl");
    const col = o.color || "#fff", wob = o.wobble == null ? 0.5 : o.wobble;
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, rx = o.w / 2, ry = o.h / 2;
    // hand-drawn ellipse: a little over one turn, radius drifting so the ends overlap like a real marker loop
    let d = "";
    for (let i = 0; i <= 56; i++) {
      const t = -0.4 + (i / 56) * (Math.PI * 2 + 0.55), k = 1 + wob * 0.06 * Math.sin(i * 0.9) + wob * 0.04 * (i / 56);
      d += (i ? "L" : "M") + (cx + Math.cos(t) * rx * k).toFixed(1) + " " + (cy + Math.sin(t) * ry * k).toFixed(1);
    }
    c.setAttribute("d", d);
    const side = o.side || "left";
    const tip = side === "left" ? [o.x - 8, cy] : side === "right" ? [o.x + o.w + 8, cy] : [cx, o.y - 8];
    const tail = side === "left" ? [tip[0] - 170, tip[1] - 90] : side === "right" ? [tip[0] + 170, tip[1] - 90] : [tip[0] - 60, tip[1] - 170];
    const mid = [(tip[0] + tail[0]) / 2 + 30, (tip[1] + tail[1]) / 2 - 25];
    const ang = Math.atan2(tip[1] - mid[1], tip[0] - mid[0]);
    const head = (s) => [tip[0] - 34 * Math.cos(ang + s), tip[1] - 34 * Math.sin(ang + s)].map((v) => v.toFixed(1)).join(" ");
    a.setAttribute("d", `M${tail[0]} ${tail[1]} Q${mid[0]} ${mid[1]} ${tip[0]} ${tip[1]} M${head(0.5)} L${tip[0]} ${tip[1]} L${head(-0.5)}`);
    [c, a].forEach((p) => { p.style.stroke = col; const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
    lbl.textContent = o.label || ""; lbl.style.color = col;
    Object.assign(lbl.style, side === "right" ? { left: tail[0] - 20 + "px" } : { left: Math.max(30, tail[0] - 200) + "px" }, { top: tail[1] - 70 + "px" });
    tl.set(root, { opacity: 1 }, o.start);
    if (o.circle !== false) tl.to(c, { strokeDashoffset: 0, duration: 0.45, ease: "power1.inOut" }, o.start);
    if (o.arrow !== false) tl.to(a, { strokeDashoffset: 0, duration: 0.25, ease: "power1.out" }, o.start + 0.4);
    tl.to(lbl, { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "power1.out" }, o.start + 0.55);
    if (o.end != null) tl.to(root, { opacity: 0, duration: 0.2, ease: "power2.in" }, o.end);
    return root;
  }
</script>
