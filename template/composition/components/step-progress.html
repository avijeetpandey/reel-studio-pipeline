<!--
COMPONENT: step-progress — visible list progress: a kicker "TOOL 2 OF 3" + a numbered stepper (current step filled, done steps ticked)
and an optional big-numeral beat (a giant accent "2" alone in the graphics band when the number is said).
From the reference reels (nocode.joshua "SKILL 1 OF 5" + stepper, giant serif numerals; WINNING_PATTERNS.md §2): viewers count down, so they stay.
Seek-safe with NO callbacks: every state change is a timeline `set`/tween at its own time.

USE: paste CSS + markup into a `.g.clip` layer (graphics band, y 250–700), then
  buildStepProgress(tl, { el: "#sp", label: "TOOL", total: 3, steps: [4.2, 11.0, 18.5], end: 24.0, numeral: true })
  steps = the times each item starts (the spoken "number one / two / three"). numeral: show the big number for 0.9 s at each step.
RULES: one stepper per reel; stays in the band above the face; numbers in the accent, everything else muted; ≥ 34 px text.
FEEL: "a quiet scoreboard": dots fill with a 0.25 s power2.out, the kicker swaps instantly, the numeral rises 30 px and settles (0.35 s), leaves in 0.2 s.
-->

<!-- CSS -->
<style>
  .sp { position: absolute; left: 60px; width: 870px; top: 300px; text-align: center; opacity: 0; }
  .sp .kick { font: 600 34px "JetBrains Mono", Menlo, monospace; letter-spacing: 0.14em; color: var(--muted, #8b8f99); }
  .sp .row { display: flex; justify-content: center; align-items: center; gap: 0; margin-top: 22px; }
  .sp .st { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--muted, #8b8f99); color: var(--muted, #8b8f99);
            display: grid; place-items: center; font: 700 30px Montserrat, sans-serif; background: transparent; }
  .sp .ln { width: 70px; height: 3px; background: var(--muted, #8b8f99); opacity: 0.5; }
  .sp .num { position: absolute; left: 0; right: 0; top: 150px; font: 400 240px/1 "Source Serif 4", Georgia, serif; color: var(--accent); opacity: 0; }
</style>

<!-- MARKUP -->
<div id="sp" class="sp"><div class="kick"></div><div class="row"></div><div class="num"></div></div>

<!-- JS -->
<script>
  function buildStepProgress(tl, o) {
    const root = document.querySelector(o.el), row = root.querySelector(".row"), kick = root.querySelector(".kick"), num = root.querySelector(".num");
    row.innerHTML = "";
    const dots = [];
    for (let i = 0; i < o.total; i++) {
      if (i) { const l = document.createElement("i"); l.className = "ln"; row.appendChild(l); }
      const d = document.createElement("b"); d.className = "st"; d.textContent = i + 1; row.appendChild(d); dots.push(d);
    }
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#3ee0ff";
    tl.set(root, { opacity: 0 }, 0);
    tl.to(root, { opacity: 1, duration: 0.25, ease: "power2.out" }, o.steps[0] - 0.1);
    o.steps.forEach((t, i) => {
      tl.set(kick, { textContent: `${o.label || "STEP"} ${i + 1} OF ${o.total}` }, t);
      tl.to(dots[i], { backgroundColor: accent, borderColor: accent, color: "#0b0d12", scale: 1.08, duration: 0.25, ease: "power2.out" }, t);
      tl.to(dots[i], { scale: 1, duration: 0.2 }, t + 0.25);
      if (i > 0) tl.set(dots[i - 1], { textContent: "✓" }, t);
      if (o.numeral) {
        tl.set(num, { textContent: String(i + 1) }, t);
        tl.fromTo(num, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        tl.to(num, { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, t + 0.9);
      }
    });
    if (o.end != null) tl.to(root, { opacity: 0, duration: 0.22, ease: "power2.in" }, o.end);
    return root;
  }
</script>
