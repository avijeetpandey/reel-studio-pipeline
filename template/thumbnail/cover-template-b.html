<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Variant B — "bold answer" cover. A = curiosity question, B = confident claim. Post one, test the other. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #02050b; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Montserrat, sans-serif; color: #fff; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 620px 620px at 540px 820px, rgba(62,224,255,0.28), rgba(62,224,255,0) 70%),
      linear-gradient(180deg, #050a18 0%, #03070f 60%, #010307 100%);
  }
  /* faint wall of vector numbers */
  .rain {
    position: absolute; inset: -20px; padding: 10px;
    font-family: "JetBrains Mono", monospace; font-size: 26px; line-height: 38px; letter-spacing: 0.04em;
    color: rgba(62,224,255,0.10); word-break: break-all;
    -webkit-mask-image: radial-gradient(ellipse 700px 900px at 50% 45%, rgba(0,0,0,0.25), #000 75%);
  }
  #me {
    position: absolute; left: -230px; top: -430px; width: 1540px;
    filter: drop-shadow(0 0 6px rgba(62,224,255,0.95)) drop-shadow(0 0 40px rgba(62,224,255,0.45));
  }
  .shade { position: absolute; left: 0; right: 0; top: 1020px; bottom: 0; background: linear-gradient(to bottom, rgba(2,5,11,0) 0%, rgba(2,5,11,0.88) 32%, rgba(2,5,11,0.96) 100%); }
  .eyebrow {
    position: absolute; left: 0; right: 0; top: 262px; text-align: center;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 36px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #3ee0ff; text-shadow: 0 0 18px rgba(62,224,255,0.6), 0 4px 0 rgba(0,0,0,0.7);
  }
  .vec {
    position: absolute; padding: 14px 22px; border-radius: 18px;
    background: rgba(6,12,22,0.86); border: 2px solid rgba(62,224,255,0.55);
    box-shadow: 0 0 28px rgba(62,224,255,0.35);
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; white-space: nowrap;
  }
  .vec b { font-family: Montserrat, sans-serif; font-weight: 900; color: #fff; margin-right: 10px; }
  .vec span { color: #3ee0ff; }
  .v1 { left: 40px; top: 430px; transform: rotate(-4deg); }
  .v2 { right: 40px; top: 520px; transform: rotate(3deg); }
  .claim { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; }
  .claim .l1 { font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: -0.01em; text-shadow: 0 8px 0 rgba(0,0,0,0.6); }
  .claim .l2 {
    font-size: 236px; font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; color: #3ee0ff;
    text-shadow: 0 0 50px rgba(62,224,255,0.65), 0 10px 0 rgba(0,0,0,0.6);
  }
  .brand {
    position: absolute; left: 0; right: 0; top: 1610px; text-align: center;
    font-family: "JetBrains Mono", monospace; font-size: 34px; font-weight: 700; letter-spacing: 0.2em;
    color: rgba(255,255,255,0.85); text-transform: uppercase;
  }
  .brand b { color: #3ee0ff; }
</style>
</head>
<body>
<div id="c">
  <div class="bg"></div>
  <div class="rain" id="rain"></div>
  <img id="me" src="cutout.png" />
  <div class="shade"></div>
  <div class="eyebrow">How ChatGPT actually works</div>
  <div class="vec v1"><b>dog</b><span>[0.21, -0.83, 0.57]</span></div>
  <div class="vec v2"><b>puppy</b><span>[0.19, -0.80, 0.61]</span></div>
  <div class="claim">
    <div class="l1">IT'S JUST</div>
    <div class="l2">MATH.</div>
  </div>
  <div class="brand">__BRAND__</div>
</div>
<script>
  // deterministic number wall
  let s = 11, out = "";
  const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 900; i++) out += (r() < 0.5 ? "-" : " ") + r().toFixed(2) + ", ";
  document.getElementById("rain").textContent = out;
</script>
</body>
</html>
